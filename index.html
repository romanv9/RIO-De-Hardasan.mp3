<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трек • Прослушивание</title>
    <style>
        body { 
            background: #121212; 
            color: #ffffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .player {
            background: #181818;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            width: 300px;
        }
        .cover {
            width: 200px;
            height: 200px;
            background: #282828;
            border-radius: 12px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .artist {
            color: #b3b3b3;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .play-btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .hidden-message {
            display: none;
            font-size: 1.8rem;
            color: #ff334b;
            font-weight: bold;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="player" id="playerCard">
        <div class="cover">🎵</div>
        <div class="track-title">De Hardasan</div>
        <div class="artist">RIO</div>
        <button class="play-btn" onclick="revealJoke()">Включить</button>
    </div>

    <div class="hidden-message" id="jokeMessage">
        Peyser cixdiz
    </div>

    <script>
        function revealJoke() {
            document.getElementById('playerCard').style.display = 'none';
            document.getElementById('jokeMessage').style.display = 'block';
        }
    </script>
</body>
</html>
